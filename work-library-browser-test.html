<!doctype html><meta charset="utf-8"><title>VibeCanvas 本地存储测试</title><script src="/work-library.js"></script><pre id="result">运行中…</pre><script>
(async()=>{const out=document.getElementById('result'),lib=window.WorkLibrary;let failures=0,passed=0;const check=(condition,name)=>{if(!condition){failures++;out.textContent+='\n失败：'+name}else{passed++;out.textContent+='\n通过：'+name}};
const id=crypto.randomUUID(),copyId=crypto.randomUUID();const now=Date.now();const blob=new Blob(['test'],{type:'image/png'});const data={schemaVersion:1,id,revision:0,name:'测试作品',createdAt:now,updatedAt:now,prompt:'校园',content:{title:'初始',subtitle:'副标题',description:'正文',tags:['校园'],event:{time:null,location:null,organizer:null}},mode:'upload',photoBlob:blob,imagePrompt:'',selectedStyleId:'visual',paletteId:'sky',crops:{minimal:{x:50,y:50,zoom:1},visual:{x:23,y:50,zoom:1.5},magazine:{x:50,y:50,zoom:1}},thumbnail:null,hasResult:true};
try{const first=await lib.save(data,0);const edited=await lib.save({...first,content:{...first.content,title:'新标题'}},first.revision);let conflict=false;try{await lib.save({...first,content:{...first.content,title:'旧标题'}},first.revision)}catch(e){conflict=/冲突/.test(e.message)}check(conflict,'旧版本写入被拒绝');const reloaded=await lib.get(id);check(reloaded.content.title==='新标题'&&reloaded.photoBlob instanceof Blob&&reloaded.crops.visual.x===23,'读回文字、图片和裁剪');const copy=lib.cloneRecord(reloaded,copyId);const savedCopy=await lib.save(copy,0);await lib.save({...savedCopy,content:{...savedCopy.content,title:'副本修改'}},savedCopy.revision);check((await lib.get(id)).content.title==='新标题','修改副本不影响原作');const latestCopy=await lib.get(copyId);await lib.remove(copyId,latestCopy.revision);check(!(await lib.get(copyId))&&!!(await lib.get(id)),'删除副本保留原作');const latest=await lib.get(id);await lib.remove(id,latest.revision);check(!(await lib.get(id)),'删除作品');}catch(e){failures++;out.textContent+='\n异常：'+e.message}out.textContent='完成：'+passed+' 通过，'+failures+' 失败'+out.textContent.slice(3);document.body.dataset.done='true';})();
</script>
