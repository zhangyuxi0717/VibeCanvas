      /* ----------------------------------------
       * 产品事件
       *
       * 只上报「发生了什么」：事件名和短枚举/数字，不发送主题、正文、照片。
       * 攒够 10 条或 5 秒发一次；页面隐藏时用 sendBeacon 补发，避免导出后丢失。
       * ---------------------------------------- */
      const Track = (() => {
        const anonId = (() => {
          try { let id = localStorage.getItem("vc-anon-id"); if (!id) { id = crypto.randomUUID(); localStorage.setItem("vc-anon-id", id); } return id; } catch { return null; }
        })();
        let queue = [], timer = null;
        const post = body => {
          try {
            if (document.visibilityState === "hidden" && navigator.sendBeacon) navigator.sendBeacon("/api/events", new Blob([body], { type: "application/json" }));
            else fetch("/api/events", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {});
          } catch {}
        };
        const flush = () => {
          if (timer) { clearTimeout(timer); timer = null; }
          if (!queue.length) return;
          const batch = queue.splice(0, 20);
          post(JSON.stringify({ events: batch, anonymousId: anonId, appVersion: "web" }));
        };
        const send = (name, props) => {
          queue.push({ name, props: props || {} });
          if (queue.length >= 10) flush();
          else if (!timer) timer = setTimeout(flush, 5000);
        };
        window.addEventListener("pagehide", flush);
        return { send, flush };
      })();

      // 把错误归成几类，便于统计「失败原因」，又不需要记录错误原文。
      const errorKind = err => {
        const message = String(err?.message || "");
        if (/额度|上限|频繁/.test(message)) return "quota";
        if (/登录|未配置|受邀/.test(message)) return "auth";
        if (/超时|Timeout|Abort/.test(message)) return "timeout";
        if (/连接|network|Failed to fetch/.test(message)) return "network";
        if (/格式/.test(message)) return "format";
        if (/配图|图片/.test(message)) return "image";
        return "unknown";
      };

       * Lucide 图标
       *
       * 在组件自己的 DOM 容器中创建 SVG，避免 Lucide
       * 直接修改 React 管理的节点。
       * ---------------------------------------- */

      function Icon({ name, size = 18, className = "", strokeWidth = 1.8 }) {
        const containerRef = useRef(null);

        useEffect(() => {
          const container = containerRef.current;
          if (!container || !window.lucide) return;

          container.innerHTML = "";

          const placeholder = document.createElement("i");
          placeholder.setAttribute("data-lucide", name);
          container.appendChild(placeholder);

          window.lucide.createIcons({
            root: container,
            attrs: {
              width: size,
              height: size,
              "stroke-width": strokeWidth,
              "aria-hidden": "true",
            },
          });

          return () => {
            container.innerHTML = "";
          };
        }, [name, size, strokeWidth]);

        return (
          <span
            ref={containerRef}
            className={`inline-flex shrink-0 items-center justify-center ${className}`}
            aria-hidden="true"
          />
        );
      }

      function getLayoutWarnings(content, { photo, mode, imageBusy, isCarousel } = {}) {
        const warnings = [];
        const title = String(content?.title || "");
        const subtitle = String(content?.subtitle || "");
        const body = String(content?.description || "");
        if (title.length > 14) warnings.push("标题接近版面上限，建议控制在 14 字以内。");
        if (subtitle.length > 24) warnings.push("副标题较长，移动端可能需要换行。");
        if (body.length > 64) warnings.push("正文较长，建议删减或拆分到下一页。");
        if (/[\r\n]/.test(title + subtitle + body)) warnings.push("文本包含换行，导出前请确认断行位置。");
        if ((mode === "upload" || mode === "ai") && !photo && !imageBusy) warnings.push("当前图片来源没有可用图片，将按纯文字预览导出。");
        if (isCarousel && body.length > 100) warnings.push("当前页正文接近多页内容上限，建议拆页。");

          if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {setError("请选择 JPEG、PNG 或 WebP 照片。");return;}
          if (file.size > 8*1024*1024) {setError("照片超过 8MB，请选择较小的照片。");return;}
          setPhotoLoading(true); let url=URL.createObjectURL(file);
          try { const image=new Image(); image.src=url; await image.decode(); if(!image.naturalWidth || image.naturalWidth*image.naturalHeight>40000000) throw Error(); setPhotos({minimal:{url,file},visual:{url,file},magazine:{url,file}}); url=null; setCrops({minimal:{x:50,y:50,zoom:1},visual:{x:50,y:50,zoom:1},magazine:{x:50,y:50,zoom:1}}); clearResult(); setError(""); }
          catch {setError("照片无法读取，或尺寸超过 4000 万像素。");} finally {if(url)URL.revokeObjectURL(url);setPhotoLoading(false);}
        };
        const handleRemovePhoto=()=>{if(dirty && !window.confirm("移除照片将清除当前编辑内容，是否继续？"))return;setPhotos({minimal:null,visual:null,magazine:null});clearResult();setError("");};
        const regenerateContent=async(scope)=>{
          if(requestRef.current||generating)return;
          if(scope==='page'&&!isCarousel)return;
          const message=scope==='page'?'重新生成当前页只会覆盖当前页文字，并再次调用文本模型。继续吗？':'重新生成文案会覆盖当前作品中的文字，并再次调用文本模型。继续吗？';
          if(!window.confirm(message))return;
          const version=++workVersion.current;requestRef.current=true;setGenerating(true);setGenerationStep(1);setError('');
          try{
            let image;
            if(mode==='upload'&&firstPhoto?.file){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('无法读取照片，请重新选择。'));reader.readAsDataURL(firstPhoto.file);});image={type:firstPhoto.file.type,data:dataUrl.split(',')[1]};}
            setGenerationStep(2);
            const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt.trim(),image,needImagePrompt:false,mode:isCarousel?'carousel':undefined}),signal:AbortSignal.timeout(50000)});
            const data=await response.json();if(!response.ok)throw Error(data.error||'重新生成失败，请重试。');
            if(workVersion.current!==version)return;setGenerationStep(3);
            if(isCarousel){
              if(scope==='page'){const index=work.pages.findIndex(page=>page.id===work.activePageId);const next=data.pages?.[Math.min(Math.max(index,0),data.pages.length-1)];if(!next)throw Error('模型未返回可用页面。');pageEdit(work.activePageId,{title:next.title,subtitle:next.subtitle,body:next.body,tags:next.tags||[]});}
              else {setField('content',data);setField('publishCopy',data.publishCopy);setTagsText((data.publishCopy?.tags||data.tags).join('，'));}
            }else{setContent(data);setTagsText(data.tags.join('，'));}
            setDirty(false);setCopyState('');
          }catch(err){setError(err.name==='TimeoutError'||err.name==='AbortError'?'生成超时，请重试。':err.message||'重新生成失败，请重试。');}
          finally{requestRef.current=false;setGenerating(false);setGenerationStep(0);}
        };
        const handleGenerate = useCallback(async () => {
          const cleanPrompt = prompt.trim();
          if (requestRef.current) return;
          if (!cleanPrompt && !(mode==="upload" && firstPhoto)) { setError("请输入活动主题或上传照片。"); return; }
          if (dirty && !window.confirm("重新生成将覆盖你修改的文案，是否继续？")) return;
          const version=++workVersion.current;
          requestRef.current = true; setGenerating(true); setGenerationStep(1); setError(""); setExportError(""); setImageStatus(""); setImageError("");
          const startedAt = Date.now(); Track.send("generate_start", { mode, documentType: isCarousel ? "carousel" : "single" });
          try {
            let image; if(mode==="upload" && firstPhoto) {const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error("无法读取照片，请重新选择。"));reader.readAsDataURL(firstPhoto.file);}); image={type:firstPhoto.file.type,data:dataUrl.split(",")[1]};}
            setGenerationStep(2);
            const response = await fetch("/api/generate", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt:cleanPrompt,image,needImagePrompt:mode==="ai",mode:isCarousel?"carousel":undefined}), signal:AbortSignal.timeout(50000)});
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "生成失败，请重试。");
            if (!data || typeof data.title !== "string" || !Array.isArray(data.tags) || !data.event || (isCarousel && (!Array.isArray(data.pages)||data.pages.length<3))) throw new Error("返回的文案格式不正确，请重试。");
            setGenerationStep(3);
            if(workVersion.current!==version)return;
            if(isCarousel){const defaultCrop={minimal:{x:50,y:50,zoom:1},visual:{x:50,y:50,zoom:1},magazine:{x:50,y:50,zoom:1}};const pages=data.pages.map(page=>({...page,id:crypto.randomUUID(),crops:structuredClone(defaultCrop),photoBlob:null}));setField('content',data);setField('pages',pages);setField('publishCopy',data.publishCopy);setField('activePageId',pages[0].id);setField('selectedStyleId','minimal');}else setContent(data); setTagsText((data.publishCopy?.tags||data.tags).join("，")); setHasResult(true); setDirty(false); setCopyState("");
            if(mode==="ai"){setImagePrompt(data.imagePrompt);setField('imagePromptEn',data.imagePromptEn||'');setField('imagePromptEnFor',String(data.imagePrompt||'').trim());startImages(data.imagePrompt,version,data.imagePromptEn);}
            Track.send("generate_success", { mode, documentType: isCarousel ? "carousel" : "single", durationMs: Date.now() - startedAt, pageCount: isCarousel ? data.pages.length : 1 });
          } catch (err) { Track.send("generate_fail", { mode, documentType: isCarousel ? "carousel" : "single", durationMs: Date.now() - startedAt, errorKind: errorKind(err) }); setError(err.name === "TimeoutError" || err.name === "AbortError" ? "生成超时，请检查网络后重试。" : err instanceof SyntaxError ? "服务返回的内容格式不正确，请重试。" : (err.message === "Failed to fetch" ? "无法连接本地服务，请确认服务已启动后重试。" : err.message)); }
          finally {requestRef.current = false; setGenerating(false); setGenerationStep(0);}
        }, [prompt, dirty, firstPhoto, mode, isCarousel, content]);

        const handleEdit = (field, value) => {
          // 编辑事件按 15 秒节流，避免敲一次字发一条。
          if (Date.now() - (window.__vcLastEditAt || 0) > 15000) { window.__vcLastEditAt = Date.now(); Track.send("edit", { surface: "sidebar" }); }
          setDirty(true); setCopyState("");
          if (field === "tags") {
            const parts=value.replace(/#/g,"").split(/[,，]/).slice(0,4).map(t=>t.slice(0,10));
            setTagsText(parts.join("，")); setContent(current=>({...current,tags:parts.map(t=>t.trim()).filter(Boolean)}));
          } else setContent(current=>({...current,[field]:value}));
        };
        const pageEdit=(id,patch)=>setField('pages',current=>(current||[]).map(page=>page.id===id?{...page,...patch}:page));
        const selectPage=id=>{setField('activePageId',id);setExportError('');};
        const addPage=()=>{if(!isCarousel||work.pages.length>=6)return;const page={id:crypto.randomUUID(),type:'content',title:'新内容页',subtitle:'继续分享一个发现',body:'补充这一页的校园故事，让内容自然推进。',tags:['校园生活'],crops:{minimal:{x:50,y:50,zoom:1},visual:{x:50,y:50,zoom:1},magazine:{x:50,y:50,zoom:1}},photoBlob:null};const pages=[...work.pages];pages.splice(Math.max(1,pages.length-1),0,page);setField('pages',pages);setField('activePageId',page.id);setHasResult(true);};
        const copyPage=()=>{if(!isCarousel||!activePage||work.pages.length>=6)return;const copy={...structuredClone(activePage),id:crypto.randomUUID(),type:'content',title:activePage.title+' 副本'};const index=work.pages.findIndex(page=>page.id===activePage.id);const pages=[...work.pages];pages.splice(index+1,0,copy);setField('pages',pages);setField('activePageId',copy.id);};
        const deletePage=()=>{if(!isCarousel||!activePage||work.pages.length<=3)return;if(!window.confirm('删除当前页面？'))return;const index=work.pages.findIndex(page=>page.id===activePage.id);const pages=work.pages.filter(page=>page.id!==activePage.id);setField('pages',pages);setField('activePageId',pages[Math.max(0,index-1)].id);};
        const movePage=(direction)=>{if(!isCarousel||!activePage)return;const index=work.pages.findIndex(page=>page.id===activePage.id),next=index+direction;if(next<=0||next>=work.pages.length-1)return;const pages=[...work.pages];[pages[index],pages[next]]=[pages[next],pages[index]];setField('pages',pages);};
        const activeCrops=isCarousel?(activePage?.crops||crops):crops;
        const layoutWarnings=getLayoutWarnings(content,{photo:firstPhoto,mode,imageBusy,isCarousel});

        const handleCopy = useCallback(async () => {
          const text = [content.title, content.subtitle, content.description, ...Object.values(content.event).filter(Boolean), content.tags.map(tag=>"#"+tag).join(" ")].filter(Boolean).join("\n\n");
          try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); } else { const field = document.createElement("textarea"); field.value = text; field.style.position = "fixed"; field.style.left = "-10000px"; document.body.appendChild(field); field.select(); const copied = document.execCommand("copy"); field.remove(); if (!copied) throw new Error("Copy unavailable"); } setCopyState("done"); } catch (err) { setCopyState("error"); }
        }, [content]);
        const handleDownload = useCallback(async () => {
          if (!exportRef.current || !selectedStyle) return;
          if (photoLoading) {setExportError("照片仍在加载，请稍候。");return;}

          if (!window.html2canvas) {
            setExportError("导出工具加载失败，请检查网络后刷新页面重试。");
            return;
          }

          setDownloading(true);
          setExportError("");

          try {
            if (document.fonts && document.fonts.ready) {
              await document.fonts.ready;
            }

            const exportPhoto=photos[selectedStyle.id];
            if (exportPhoto) {const image=new Image();image.src=exportPhoto.url;await image.decode();}
            const canvas = await window.html2canvas(exportRef.current, {
              backgroundColor: null,
              scale: 2,
              useCORS: true,
              logging: false,
            });

            const link = document.createElement("a");
            const safeTitle = (content.title || "校园创意")
              .replace(/[\\/:*?"<>|]/g, "")
              .slice(0, 20);

            link.download = `VibeCanvas-${safeTitle}-${selectedStyle.name}.png`;
            link.href = canvas.toDataURL("image/png");
            document.body.appendChild(link);
            link.click();
            link.remove();
            Track.send("export", { target: "single", styleId: selectedStyle.id });
          } catch (downloadError) {
            console.error(downloadError);
            setExportError("导出失败，请刷新页面后重试。");
          } finally {
            setDownloading(false);
          }
        }, [content.title, selectedStyle, photos, photoLoading]);
        const waitForPoster = async()=>{if(document.fonts?.ready)await document.fonts.ready;const exportPhoto=selectedStyle?photos[selectedStyle.id]:null;if(exportPhoto?.url){const image=new Image();image.src=exportPhoto.url;await image.decode();}await new Promise(requestAnimationFrame);};
        const capturePoster = async()=>{await waitForPoster();return window.html2canvas(exportRef.current,{backgroundColor:null,scale:1.8,useCORS:true,logging:false,width:600,height:800});};
        const handleDownloadPage = async()=>{if(!window.html2canvas||!selectedStyle)return;setDownloading(true);setExportError('');try{const canvas=await capturePoster();const link=document.createElement('a');const safe=(content.title||'校园创意').replace(/[\\/:*?"<>|]/g,'').slice(0,20);link.download=`VibeCanvas-${safe}-第${isCarousel?(work.pages.findIndex(page=>page.id===work.activePageId)+1):1}页.png`;link.href=canvas.toDataURL('image/png');link.click();Track.send('export',{target:'page',styleId:selectedStyle.id});}catch{setExportError('当前页导出失败，请确认图片和字体已加载后重试。')}finally{setDownloading(false);}};
        const handleDownloadZip = async()=>{if(!isCarousel||!window.JSZip||!selectedStyle)return;const original=work.activePageId;setDownloading(true);setExportError('');try{const zip=new JSZip();for(let i=0;i<work.pages.length;i++){const page=work.pages[i];setExportError(`正在导出第 ${i+1} / ${work.pages.length} 页…`);setField('activePageId',page.id);await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const canvas=await capturePoster();const data=canvas.toDataURL('image/png').split(',')[1];zip.file(`${String(i+1).padStart(2,'0')}-${(page.title||'页面').replace(/[\\/:*?"<>|]/g,'').slice(0,24)}.png`,data,{base64:true});}const blob=await zip.generateAsync({type:'blob',compression:'STORE'});const link=document.createElement('a');link.download=`VibeCanvas-${(work.name||'小红书图文').replace(/[\\/:*?"<>|]/g,'').slice(0,24)}.zip`;link.href=URL.createObjectURL(blob);link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);setExportError('整组导出完成');Track.send('export',{target:'zip',styleId:selectedStyle.id,pageCount:work.pages.length});}catch(err){setExportError(`批量导出失败：${err.message||'请重试'}。`)}finally{setField('activePageId',original);setDownloading(false);}};

        return (
          <div id="top" className="min-h-screen bg-[#f8f9f7]">
            <Header />

            <main className="mx-auto max-w-[1440px] px-5 pb-16 pt-10 sm:px-8 sm:pt-14 lg:px-12">
              <fieldset disabled={!storageReady} aria-busy={!storageReady}>
              <div className="workspace-bar mb-7 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-3">
                <div><p className="text-sm font-semibold text-white">{work.name} <span role="status" className="ml-2 text-xs font-normal text-[#b6b8cc]">{saveStatus}</span></p><p className="mt-1 text-[11px]">本地作品保存在当前浏览器；云端状态：{cloudStatus}。清除浏览器数据不会删除已同步作品。</p>{saveError && <p role="alert" className="mt-1 text-xs text-[#f1a995]">{saveError} {firstPhoto ? '本次图片未保存，请重试。' : ''}</p>}{cloudError && <p role="alert" className="mt-1 text-xs text-[#f1a995]">{cloudError}</p>}{cloudUser && <p className="mt-1 text-[11px] text-[#a7abbd]">账号：{cloudUser.email||'已登录'} · 云端作品 {cloudWorks.length} 个 · 当前作品 {work.cloudId?'已关联':'仅本地'}</p>}</div>
                <div className="flex flex-wrap gap-2">{billingConfig?.enabled && <button type="button" onClick={()=>{const next=!billingOpen;setBillingOpen(next);if(next){loadBillingWallet();loadBillingOrders();}}} className="secondary-action rounded-lg px-3 py-2 text-xs">{billingWallet?`额度 ${billingWallet.available}`:'额度与订单'}</button>}<button type="button" onClick={()=>flushSave().catch(()=>{})} className="secondary-action rounded-lg px-3 py-2 text-xs">重试保存</button><button type="button" disabled={generating || imageBusy || photoLoading} onClick={()=>{loadList();setLibraryOpen(!libraryOpen)}} className="secondary-action rounded-lg px-3 py-2 text-xs disabled:opacity-50">作品库</button><button type="button" disabled={generating || imageBusy || photoLoading} onClick={createWork} className="secondary-action rounded-lg px-3 py-2 text-xs disabled:opacity-50">新作品</button>{cloudUser?<><button type="button" disabled={cloudBusy} onClick={()=>syncCurrent()} className="primary-action rounded-lg px-3 py-2 text-xs disabled:opacity-50">{cloudBusy?'同步中…':'同步当前作品'}</button><button type="button" disabled={cloudBusy} onClick={migrateLocalWorks} className="secondary-action rounded-lg px-3 py-2 text-xs disabled:opacity-50">迁移本地作品（{libraryList.length} 个）</button><button type="button" disabled={cloudBusy} onClick={signOut} className="secondary-action rounded-lg px-3 py-2 text-xs">退出 {cloudUser.email||''}</button></>:<button type="button" disabled={cloudBusy||cloudStatus==='云端未配置'} onClick={signIn} className="secondary-action rounded-lg px-3 py-2 text-xs disabled:opacity-50">登录并同步</button>}</div>
              </div>
              {billingOpen && billingConfig?.enabled && (
                <section aria-label="额度与订单" className="editor-panel mb-7 rounded-2xl border border-violet-300/20 p-5">
                  <div className="mb-3 flex flex-wrap items-start justify-between gap-3">
                    <div>
                      <h2 className="text-lg font-semibold">额度与订单</h2>
                      <p className="mt-1 text-xs text-[#a7abbd]">1 额度 = 1 张 AI 配图；一次「AI 配图」默认生成 3 张，消耗 3 额度。文字生成不计额度。</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="glass-chip rounded-full border px-3 py-1.5 text-xs">可用 {billingWallet?billingWallet.available:'—'}{billingWallet&&billingWallet.reserved>0?` · 预占 ${billingWallet.reserved}`:''}</span>
                      <button type="button" onClick={()=>setBillingOpen(false)} className="secondary-action rounded-lg px-3 py-2 text-xs">关闭</button>
                    </div>
                  </div>
                  {billingConfig.paused && <p className="mb-3 rounded-xl border border-amber-300/30 bg-amber-400/10 px-3 py-2 text-xs text-amber-200">生成服务已暂停，暂停期间无法发起新的配图或文字生成。</p>}
                  {billingError && <p role="alert" className="mb-3 rounded-xl border border-red-300/30 bg-red-400/10 px-3 py-2 text-xs text-red-200">{billingError}</p>}
                  {billingNotice && <p role="status" className="mb-3 rounded-xl border border-emerald-300/30 bg-emerald-400/10 px-3 py-2 text-xs text-emerald-200">{billingNotice}</p>}
                  <div className="grid gap-3 md:grid-cols-2">
                    {billingConfig.products.map(product=>(
                      <div key={product.id} className="rounded-xl border border-white/10 bg-white/[0.03] p-4">
                        <div className="flex items-baseline justify-between gap-2">
                          <p className="text-sm font-semibold text-white">{product.title}</p>
                          <p className="text-lg font-semibold text-white">¥{product.price}</p>
                        </div>
                        <p className="mt-1 text-xs text-[#a7abbd]">{product.description}</p>
                        <p className="mt-2 text-xs text-[#c2b9fb]">{product.credits} 额度 · {product.validity}</p>
                        <button type="button" disabled={billingBusy||billingConfig.paused} onClick={()=>buyBillingProduct(product)} className="primary-action mt-3 w-full rounded-lg px-3 py-2 text-xs disabled:opacity-50">{billingBusy?'正在创建订单…':`购买 ¥${product.price}`}</button>
                      </div>
                    ))}
                  </div>
                  <div className="mt-5 grid gap-4 lg:grid-cols-2">
                    <div>
                      <div className="mb-2 flex items-center justify-between"><h3 className="text-sm font-semibold">订单</h3><button type="button" onClick={()=>loadBillingOrders()} className="secondary-action rounded-lg px-2 py-1 text-[11px]">刷新</button></div>
                      {(!billingOrders||!billingOrders.length)?<p className="text-xs text-[#a7abbd]">还没有订单。</p>:<div className="space-y-2">{billingOrders.slice(0,8).map(order=>(
                        <div key={order.outTradeNo} className="rounded-xl border border-white/10 bg-white/[0.03] p-3 text-xs">
                          <div className="flex items-center justify-between gap-2"><span className="font-semibold text-white">{order.productTitle}</span><span className={order.status==='paid'?'text-emerald-300':order.status==='pending'?'text-amber-200':'text-[#a7abbd]'}>{billingConfirming===order.outTradeNo?'确认中…':order.statusText}</span></div>
                          <p className="mt-1 text-[#a7abbd]">¥{order.amount} · {order.credits} 额度 · {new Date(order.createdAt).toLocaleString()}</p>
                          <p className="mt-1 break-all text-[#7b8095]">{order.outTradeNo}{order.refund?` · 退款收回 ${order.refund.removed} 额度`:''}</p>
                          {order.status==='pending' && <button type="button" onClick={()=>queryBillingOrder(order.outTradeNo)} className="secondary-action mt-2 rounded-lg px-2 py-1 text-[11px]">查单</button>}
                        </div>
                      ))}</div>}
                    </div>
                    <div>
                      <div className="mb-2 flex items-center justify-between"><h3 className="text-sm font-semibold">额度记录</h3><button type="button" onClick={()=>loadBillingWallet()} className="secondary-action rounded-lg px-2 py-1 text-[11px]">刷新</button></div>
                      {!billingWallet?.usage?.length?<p className="text-xs text-[#a7abbd]">还没有额度变动。</p>:<div className="space-y-1.5">{billingWallet.usage.slice(0,12).map(item=>(
                        <div key={item.id} className="flex items-center justify-between gap-2 rounded-lg border border-white/5 bg-white/[0.02] px-3 py-2 text-[11px]">
                          <span className="text-[#d8daea]">{item.typeText}</span>
                          <span className="text-[#a7abbd]">{usageDelta(item)}</span>
                          <span className="text-[#7b8095]">{new Date(item.at).toLocaleString()}</span>
                        </div>
                      ))}</div>}
                    </div>
                  </div>
                  <p className="mt-4 text-[11px] leading-5 text-[#7b8095]">额度绑在当前浏览器的凭证上，清理浏览器数据或换设备后无法找回。支付结果以服务端验签的通知或主动查单为准，支付成功跳转页不会直接发放额度。</p>
                </section>
              )}
              {libraryOpen && <section aria-label="本地作品库" className="editor-panel mb-7 rounded-2xl border border-white/10 p-5"><div className="mb-4 flex items-center justify-between"><h2 className="text-lg font-semibold">本地作品库</h2><button type="button" onClick={()=>setLibraryOpen(false)} className="secondary-action rounded-lg px-3 py-2 text-xs">关闭</button></div>{libraryList.length===0 ? <p className="text-sm">还没有已保存的作品。</p> : <div className="grid gap-3 md:grid-cols-2">{libraryList.map(item=><div key={item.id} className="flex gap-3 rounded-xl border border-white/10 bg-white/[0.03] p-3"><WorkThumbnail blob={item.thumbnail instanceof Blob ? item.thumbnail : null}/><div className="min-w-0 flex-1"><p className="truncate text-sm font-semibold">{typeof item.name==='string'?item.name:'损坏的作品'}</p><p className="mt-1 text-[11px]">{Number.isFinite(item.updatedAt)?new Date(item.updatedAt).toLocaleString():'时间不可用'}</p><div className="mt-3 flex flex-wrap gap-2">{[['打开',()=>openWork(item.id)],['重命名',()=>renameWork(item)],['复制',()=>copyWork(item)],['删除',()=>deleteWork(item)]].map(([label,fn])=><button key={label} type="button" aria-label={label+' '+(item.name||'作品')} onClick={fn} disabled={generating || imageBusy || photoLoading} className="secondary-action rounded-lg px-2 py-1.5 text-xs disabled:opacity-50">{label}</button>)}</div></div></div>)}</div>}</section>}
              {libraryOpen && cloudUser && <section aria-label="云端作品库" className="editor-panel mb-7 rounded-2xl border border-violet-300/20 p-5"><div className="mb-4 flex items-center justify-between"><div><h2 className="text-lg font-semibold">云端作品库</h2><p className="mt-1 text-xs text-[#a7abbd]">只显示当前账号作品；删除云端作品不会删除本地原件。</p></div><button type="button" onClick={loadCloudWorks} disabled={cloudBusy} className="secondary-action rounded-lg px-3 py-2 text-xs">刷新</button></div>{cloudWorks.length===0?<p className="text-sm">还没有云端作品。当前本地作品可通过“同步到云端”迁移。</p>:<div className="grid gap-3 md:grid-cols-2">{cloudWorks.map(item=><div key={item.id} className="rounded-xl border border-white/10 bg-white/[0.03] p-3"><p className="truncate text-sm font-semibold">{item.name}</p><p className="mt-1 text-[11px] text-[#a7abbd]">{item.document_type} · 修订 {item.revision} · {item.updated_at?new Date(item.updated_at).toLocaleString():''}</p><div className="mt-3 flex flex-wrap gap-2"><button type="button" onClick={()=>openCloudWork(item)} disabled={cloudBusy} className="secondary-action rounded-lg px-2 py-1.5 text-xs">打开并继续编辑</button><button type="button" onClick={async()=>{if(!window.confirm('确定删除此云端作品？本地原件不会删除。'))return;try{await cloudFetch('/api/cloud/works/'+item.id,{method:'DELETE'});await loadCloudWorks();}catch(e){setCloudError(e.message||'删除失败。');}}} disabled={cloudBusy} className="secondary-action rounded-lg px-2 py-1.5 text-xs">删除云端作品</button></div></div>)}</div>}</section>}

              {/* 标题区 */}
              <div className="hero-panel mb-10 flex flex-wrap items-end justify-between gap-6">
                <div className="max-w-2xl">
                  <div className="glass-chip mb-4 inline-flex items-center gap-2 rounded-full border border-[#e4ecdf] bg-[#f0f6ec] px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[0.14em] text-[#7b9d6e]">
                    <Icon name="sparkles" size={12} />
                    CREATIVE SYSTEM // VIBECANVAS 01
                  </div>
                  <h1 className="font-display text-[32px] font-bold leading-[1.2] tracking-[-0.06em] text-[#273329] sm:text-[43px]">
                    让校园里的
                    <span className="relative inline-block text-[#82a56e]">
                      好点子
                      <span className="absolute -bottom-1 left-0 h-[5px] w-full rounded-full bg-[#d9ebcf]" />
                    </span>
                    ，
                    <br className="sm:hidden" />
                    被更多人看见。
                  </h1>
                  <p className="mt-4 max-w-xl text-sm leading-7 text-[#909b8d]">
                    VibeCanvas 校园多模态创意与海报微工坊。
                    从一句灵感出发，轻松创作你的专属图文与海报。
                  </p>
                </div>
                <div className="hidden items-center gap-3 text-right md:flex">
                  <div>
                    <p className="font-display text-xs font-bold tracking-wider text-[#677963]">
                      DESIGN YOUR SIGNAL
                    </p>
                    <p className="mt-1 text-[11px] text-[#abb5a8]">
                      灵感已接入，开始你的创作
                    </p>
                  </div>
                  <span className="float flex h-11 w-11 items-center justify-center rounded-full border border-[#e3ebdf] bg-white text-[#91af83]">
                    <Icon name="asterisk" size={23} />
                  </span>
                </div>
              </div>

              <div className="workspace-layout grid items-start gap-7 lg:grid-cols-[340px_minmax(0,1fr)] xl:grid-cols-[370px_minmax(0,1fr)]">
                {/* 左侧控制区 */}
                <div className="space-y-5">
                  <PromptPanel
                    prompt={prompt}
                    setPrompt={(value) => {
                      setPrompt(value);
                      if (error) setError("");
                    }}
                    onGenerate={handleGenerate}
                    generating={generating}
                    error={error}
                    photo={firstPhoto}
                    photoLoading={photoLoading}
                    onPhoto={handlePhoto}
                    onRemovePhoto={handleRemovePhoto}
                    mode={mode}
                    onModeChange={handleModeChange}
                    imageBusy={imageBusy}
                    documentType={work.documentType}
                    onDocumentTypeChange={handleDocumentTypeChange}
                  />

                  <ProgressPanel
                    generating={generating}
                    hasResult={hasResult}
                    error={error}
                    generationStep={generationStep}
                  />

                  <div className="flex items-center gap-3 px-1 text-[11px] leading-5 text-[#a1aca0]">
                    <Icon name="heart" size={15} className="text-[#9ab88b]" />
                    <span>为每一个认真生活、热爱创造的你。</span>
                  </div>
                </div>

                {/* 右侧画布 */}
                <section
                  aria-labelledby="canvas-heading"
                  className="studio-grid min-w-0 rounded-[28px] border border-[#e7ece4] bg-[#f3f6f0] p-5 sm:p-7"
                >
                  <div className="flex flex-wrap items-start justify-between gap-4">
                    <div>
                      <div className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.18em] text-[#9ca99a]">
                        <Icon name="layout-template" size={13} />
                        OUTPUT // LIVE CANVAS
                      </div>
                      <h2
                        id="canvas-heading"
                        className="mt-2 text-xl font-semibold tracking-tight text-[#344034]"
                      >
                        你的灵感画布
                        <span className="ml-2 text-[#9ab78b]">✳</span>
                      </h2>
                      <p className="mt-2 text-xs leading-6 text-[#9ca99a]">
                        三种风格，三种表达。选择喜欢的设计继续微调。
                      </p>
                    </div>
                    <span className="inline-flex items-center gap-1.5 rounded-full border border-[#e1e9dd] bg-white/80 px-3 py-2 text-[10px] font-semibold text-[#8ca085]">
                      <span className="h-1.5 w-1.5 rounded-full bg-[#9dc28c]" />
                      {hasResult ? "3 DESIGNS READY" : "3 STYLE PREVIEWS"}
                    </span>
                  </div>

                  {!hasResult && !generating && (
                    <div className="preview-notice mt-6 flex items-start gap-2.5 rounded-xl border border-[#e2eadc] bg-white/70 px-4 py-3 text-xs leading-5 text-[#879783]">
                      <Icon
                        name="lightbulb"
                        size={15}
                        className="mt-0.5 text-[#9bbd88]"
                      />
                      <span>
                        这里展示的是示例效果。输入主题并点击生成，创建你的专属画布。
                      </span>
                    </div>
                  )}

                  {generating && (
                    <div
                      className="status-line shimmer mt-6 flex items-center gap-2.5 rounded-xl border border-[#dfebd9] bg-[#eaf4e5] px-4 py-3 text-xs text-[#77966a]"
                      role="status"
                    >
                      <Icon name="sparkles" size={15} />
                      正在请求模型，请稍候…
                    </div>
                  )}

                  {isCarousel && work.pages && <div className="editor-panel mt-6 rounded-[20px] border border-white/10 p-4" aria-label="多页管理"><div className="flex flex-wrap items-center justify-between gap-3"><div><p className="text-xs font-semibold text-white">连续多页图文</p><p className="mt-1 text-[11px] text-[#a7abbd]">{work.pages.length} 页 · 使用按钮调整顺序</p></div><div className="flex flex-wrap gap-2"><button type="button" className="secondary-action rounded-lg px-2.5 py-1.5 text-xs" onClick={addPage} disabled={work.pages.length>=6}>新增</button><button type="button" className="secondary-action rounded-lg px-2.5 py-1.5 text-xs" onClick={copyPage} disabled={work.pages.length>=6}>复制</button><button type="button" className="secondary-action rounded-lg px-2.5 py-1.5 text-xs" onClick={deletePage} disabled={work.pages.length<=3}>删除</button><button type="button" aria-label="当前页上移" className="secondary-action rounded-lg px-2.5 py-1.5 text-xs" onClick={()=>movePage(-1)}>←</button><button type="button" aria-label="当前页下移" className="secondary-action rounded-lg px-2.5 py-1.5 text-xs" onClick={()=>movePage(1)}>→</button></div></div><div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-6">{work.pages.map((page,index)=><button key={page.id} type="button" onClick={()=>selectPage(page.id)} aria-pressed={page.id===work.activePageId} className={`rounded-xl border p-2 text-left text-[11px] ${page.id===work.activePageId?'border-violet-300 bg-violet-400/20':'border-white/10 bg-white/[0.03]'}`}><span className="text-[#a7abbd]">{String(index+1).padStart(2,'0')} · {page.type==='cover'?'封面':page.type==='ending'?'结尾':'内容'}</span><span className="mt-1 block truncate font-semibold text-white">{page.title}</span></button>)}</div></div>}

                  <div className="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
                    {STYLES.map((style, index) => (
                      <div
                        key={style.id}
                        className="enter min-w-0"
                        style={{ animationDelay: `${index * 80}ms` }}
                      >
                        <ResultCard
                          style={style}
                          content={content}
                          palette={palette}
                          photo={photos[style.id]}
                          crop={crops[style.id]}
                          selected={selectedStyleId === style.id}
                          onSelect={() => {
                            setSelectedStyleId(style.id);
                            if(isCarousel && activePage) pageEdit(activePage.id,{styleId:style.id});
                            setExportError("");
                          }}
                        />
                      </div>
                    ))}
                  </div>

                  {mode==='ai' && hasResult && <div className="editor-panel mt-6 rounded-[20px] border border-white/10 p-5">
                    <label className="block text-xs font-semibold">配图描述（最多 500 字）<textarea value={imagePrompt} maxLength={500} onChange={e=>setImagePrompt(e.target.value)} rows={3} className="mt-2 w-full rounded-xl border border-white/10 bg-[#090b13] px-4 py-3 text-sm text-white" /></label>
                    <p className="mt-2 text-[11px] text-[#8e90a8]">画图模型只读英文，生成前会自动把这段中文翻译成英文；改了中文会重新翻译。</p>
                    {englishFresh && <details className="mt-1 text-[11px] text-[#8e90a8]"><summary className="cursor-pointer">查看实际送去生成的英文提示词</summary><p className="mt-1 break-words text-[#babbd1]">{imagePromptEn}</p></details>}
                    <div className="mt-3 flex flex-wrap items-center gap-3"><button type="button" disabled={imageBusy || generating || !imagePrompt.trim()} onClick={()=>startImages(imagePrompt,workVersion.current)} className="secondary-action rounded-xl px-4 py-3 text-xs font-semibold disabled:opacity-50">只重新生成配图（再次调用图片服务）</button><span role="status" className="text-xs text-[#babbd1]">{imageStatus}</span></div>
                    {imageError && <p role="alert" className="mt-2 text-xs text-[#f6ad9a]">{imageError} 已有文案和图片仍可使用。</p>}
                  </div>}
                  {selectedStyle && (
                    <EditorPanel
                      selectedStyle={selectedStyle}
                      generating={generating}
                      content={content}
                      tagsText={tagsText}
                      onEdit={handleEdit}
                      paletteId={effectivePaletteId}
                      onPaletteChange={value=>isCarousel&&activePage?pageEdit(activePage.id,{paletteId:value}):setPaletteId(value)}
                      onDownload={handleDownload}
                      downloading={downloading}
                      onCopy={handleCopy}
                      copyState={copyState}
                      onRegenerateCopy={()=>regenerateContent('copy')}
                      onRegeneratePage={isCarousel?()=>regenerateContent('page'):null}
                      layoutWarnings={layoutWarnings}
                      photo={photos[selectedStyle.id]}
                      crop={activeCrops[selectedStyle.id]}
                      onCrop={(key,value)=>isCarousel?pageEdit(activePage.id,{crops:{...activeCrops,[selectedStyle.id]:{...activeCrops[selectedStyle.id],[key]:value}}}):setCrops(current=>({...current,[selectedStyle.id]:{...current[selectedStyle.id],[key]:value}}))}
                    />
                  )}
                  {isCarousel && selectedStyle && <div className="mt-4 flex flex-wrap items-center gap-2"><button type="button" onClick={handleDownloadPage} disabled={downloading} className="secondary-action rounded-lg px-3 py-2 text-xs">下载当前页 PNG</button><button type="button" onClick={handleDownloadZip} disabled={downloading} className="primary-action rounded-lg px-3 py-2 text-xs">下载整组 ZIP</button><span role="status" className="text-xs text-[#babbd1]">导出尺寸 1080×1440（3:4）</span></div>}

                  {exportError && (
                    <p
                      role="alert"
                      className="mt-3 text-xs text-[#b75f4c]"
                    >
                      {exportError}
                    </p>
                  )}

                  {!selectedStyle && (
                    <div className="mt-7 flex items-center justify-center gap-2 text-xs text-[#a1afa0]">
                      <Icon name="mouse-pointer-2" size={14} />
                      点击任意卡片，开始个性化编辑
                    </div>
                  )}
                </section>
              </div>

              {feedbackOpen && (
                <section aria-label="意见反馈" className="editor-panel mb-7 rounded-2xl border border-white/10 p-5">
                  <div className="mb-4 flex items-center justify-between">
                    <h2 className="text-lg font-semibold">给试用版提意见</h2>
                    <button type="button" onClick={()=>setFeedbackOpen(false)} className="secondary-action rounded-lg px-3 py-2 text-xs">关闭</button>
                  </div>
                  <p className="mb-3 text-xs">只需要打分和一句话。不会读取你的照片、文案或作品内容。</p>
                  <div className="mb-3 flex flex-wrap gap-2" role="group" aria-label="体验评分">
                    {[1,2,3,4,5].map(score=>(
                      <button key={score} type="button" aria-pressed={feedbackRating===score} aria-label={score+' 分'} onClick={()=>setFeedbackRating(feedbackRating===score?0:score)} className={"secondary-action rounded-lg px-3 py-1.5 text-xs " + (feedbackRating===score?"ring-1 ring-current":"opacity-80")}>{score} 分</button>
                    ))}
                  </div>
                  <label htmlFor="feedback-text" className="mb-1 block text-xs">想说的（选填，最多 300 字）</label>
                  <textarea id="feedback-text" value={feedbackText} maxLength={300} rows={3} onChange={event=>setFeedbackText(event.target.value)} className="mb-3 w-full rounded-xl border border-white/10 bg-white/[0.03] p-3 text-sm" placeholder="哪里好用、哪里卡住，都可以写。" />
                  <div className="flex flex-wrap items-center gap-3">
                    <button type="button" disabled={feedbackBusy} onClick={submitFeedback} className="primary-action rounded-lg px-3 py-2 text-xs disabled:opacity-50">{feedbackBusy?'发送中…':'发送反馈'}</button>
                    {feedbackStatus && <span className="text-xs" role="status">{feedbackStatus}</span>}
                  </div>
                </section>
              )}
              <footer className="mt-14 flex flex-wrap items-center justify-between gap-3 border-t border-[#e7ece5] pt-6 text-[11px] text-[#aab4a7]">
                <span>© VibeCanvas · 把灵感，变成看得见的美好。</span>
                <button type="button" onClick={toggleFeedback} className="secondary-action rounded-lg px-3 py-1.5 text-xs">意见反馈</button>
                <span className="font-display tracking-wide">
                  CREATED WITH GOOD VIBES ✳
                </span>
              </footer>
              </fieldset>
            </main>

            {/* 导出专用画布：保持真实布局尺寸，但放在视口之外 */}
            {selectedStyle && (
              <div
                aria-hidden="true"
                style={{
                  position: "fixed",
                  left: "-10000px",
                  top: 0,
                  width: "600px",
                  pointerEvents: "none",
                }}
              >
                <div ref={exportRef}>
                  <Poster
                    styleId={selectedStyle.id}
                    content={content}
                    palette={palette}
                    photo={photos[selectedStyle.id]}
                    crop={activeCrops[selectedStyle.id]}
                  />
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
